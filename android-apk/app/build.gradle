plugins {
    id "com.android.application"
}

android {
    namespace "pl.local.czytnikstrony"
    compileSdk 35

    defaultConfig {
        applicationId "pl.local.czytnikstrony"
        minSdk 23
        targetSdk 35
        versionCode 9
        versionName "1.0.8"
    }

    // Stały klucz podpisywania — dzięki temu wszystkie wydania mają ten sam
    // podpis i aktualizacje OTA działają (Android nie zaktualizuje APK o innym podpisie).
    signingConfigs {
        appKey {
            storeFile file("release.keystore")
            storePassword "czytanie123"
            keyAlias "czytanie"
            keyPassword "czytanie123"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.appKey
        }
        release {
            signingConfig signingConfigs.appKey
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:language-id:17.0.6'
}
