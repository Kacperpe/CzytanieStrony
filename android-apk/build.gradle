plugins {
    id "com.android.application" version '8.13.2' apply false
}

def externalBuildRoot = providers.gradleProperty("localBuildDir").orElse("${System.getProperty("user.home")}/.czytnik-strony-build")

gradle.beforeProject { project ->
    def safeProjectPath = project.path == ":" ? "root" : project.path.substring(1).replace(":", "-")
    project.layout.buildDirectory.set(project.layout.dir(project.providers.provider {
        project.file("${externalBuildRoot.get()}/${safeProjectPath}")
    }))
}
