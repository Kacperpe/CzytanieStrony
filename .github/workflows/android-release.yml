name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x gradlew
        working-directory: android-apk

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
        working-directory: android-apk

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/CzytanieStrony-${GITHUB_REF_NAME}-debug.apk
        working-directory: android-apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: android-apk/app/build/outputs/apk/debug/CzytanieStrony-${{ github.ref_name }}-debug.apk
