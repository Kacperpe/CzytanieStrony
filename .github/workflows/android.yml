name: Android APK

on:
  push:
    branches: [ main, master, "ui-*" ]
    tags: [ "v*" ]
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log || {
            # Wypisz błędy jako adnotacje (widoczne w podsumowaniu runa)
            grep -v "> Task" build.log | grep -E "^e: |error:|What went wrong" | sed "s#file:///home/runner/work/CzytanieStrony/CzytanieStrony/android-apk/app/src/main/java/pl/local/czytnikstrony/##" | head -45 | while IFS= read -r l; do
              echo "::error::${l//%/%25}"
            done
            exit 1
          }

      - name: Collect APK
        run: |
          APK=$(find ~/.czytnik-strony-build -name "app-debug.apk" | head -1)
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$APK" "$GITHUB_WORKSPACE/out/CzytanieStrony.apk"
          ls -lh "$GITHUB_WORKSPACE/out"
          # Kontrola: czy biblioteki natywne sherpa-onnx są w APK
          unzip -l "$APK" | grep "lib/" | awk '{print $1/1048576 " MB " $4}' | while read -r l; do echo "::notice::$l"; done

      - uses: actions/upload-artifact@v4
        with:
          name: CzytanieStrony-apk
          path: out/CzytanieStrony.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: out/CzytanieStrony.apk
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
